# Temporary: probe partner links in a real browser. Runs on pushes to this temporary branch only.
name: Partner link probe
on:
  push:
    branches: [guide-screens]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - run: node scripts/probe-tiqets.mjs
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f tiqets
          git commit -m "Tiqets link probe [skip ci]"
          git push origin HEAD:guide-screens
