# Temporary: screenshots for the user guide, taken where Wikimedia photos load. Runs on pushes to this temporary branch only.
name: Google Hotels link probe
on:
  push:
    branches: [guide-screens]
permissions:
  contents: write
jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - run: node scripts/probe-google-hotels.mjs
      - name: Commit the screenshots to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f probe2
          git commit -m "Google Hotels link probe [skip ci]"
          git push
